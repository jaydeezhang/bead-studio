<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8eeea">
<meta name="description" content="在拼豆板上画像素画、闯图纸关卡，把作品熨烫成 PNG。">
<title>豆豆工坊 · 拼豆像素画</title>
<style>
/* Upper-left light and lower-right shade give the shell, keys and tray distinct depths. */
:root{
  color-scheme:light;
  --page:#e8eeea;
  --surface:#edf2ee;
  --ink:#283d38;
  --muted:#4c625a;
  --line:#cbd8d0;
  --purple:#4c3978;
  --soft:#e4dbee;
  --accent:#f3c3b2;
  --light:#fbfdfbd9;
  --shade:#829a8d45;
  --raised:4px 5px 9px var(--shade),-4px -4px 9px var(--light),inset 0 1px 1px #ffffffb0;
  --pressed:inset 3px 3px 7px #78948847,inset -3px -3px 6px #ffffffad;
  --key:linear-gradient(146deg,#f3f7f3,#e3ebe5);
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:linear-gradient(142deg,#f3f5ef 0,var(--page) 43%,#e3ebe7 100%);min-height:100vh;font:14px/1.45 var(--sans)}
h1,h2,h3,p,figure{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;color:#546960;opacity:.67}
button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
[hidden]{display:none!important}
.sprite{position:absolute;height:0;width:0;overflow:hidden}
.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.wrap{width:min(1432px,calc(100% - 64px));margin-inline:auto}
.topbar{background:#eff3ee;border-bottom:1px solid #f9fcf8;box-shadow:0 3px 12px #738b7b18}
.topbar .wrap{display:flex;min-height:69px;align-items:center;justify-content:space-between;gap:12px}
.brand,.header-actions,.action,.button,.title-row,.panel-title,.board-tools,.size-list,.mode,.board-foot,.selected-color,.color-form,.progress-label,.modal-head,.modal-actions{display:flex;align-items:center}
.brand{gap:11px;font-size:20px;font-weight:780;white-space:nowrap}
.brand small{display:block;font-size:10px;font-weight:650;color:var(--muted)}
.brand-mark{display:grid;padding:8px;gap:4px;grid-template-columns:repeat(2,9px);border-radius:8px;background:var(--key);box-shadow:var(--raised)}
.brand-mark i{width:9px;height:9px;border:2px solid #9a78cc;border-radius:50%;box-shadow:0 1px #6d4dad,inset 1px 1px 1px #70579c68}
.brand-mark i:nth-child(2){border-color:#f393ac;box-shadow:0 1px #cf647f}
.brand-mark i:nth-child(3){border-color:#78c6ab;box-shadow:0 1px #4b9e86}
.brand-mark i:nth-child(4){border-color:#efb966;box-shadow:0 1px #d19a46}
.header-actions{gap:8px}
.button,.action{justify-content:center;gap:7px;min-height:38px;padding:6px 11px;border:1px solid #f7faf6;border-right-color:#d9e3dc;border-bottom-color:#d9e3dc;border-radius:8px;background:var(--key);box-shadow:var(--raised);font-weight:650;white-space:nowrap;transition:box-shadow .16s,background-color .16s}
.button:hover:not(:disabled),.action:hover:not(:disabled){background:linear-gradient(146deg,#f9fcf7,#e8efe9);border-color:#e0e8e1}
.button.primary{background:linear-gradient(145deg,#e8dff4,#d9ccec);color:var(--purple);border-color:#f1e9fa #d3c3e6 #d3c3e6 #f1e9fa}
.button.primary:hover:not(:disabled){background:#eadff5}
.button.iron{background:linear-gradient(145deg,#f9dcd0,var(--accent));border-color:#fce7dd #e8b3a1 #e8b3a1 #fce7dd;color:#703f36}
.button.iron:hover:not(:disabled){background:#f8d6c8}
.button.danger{color:#9b3456}
.action{padding:0;width:38px;flex:none}
.mode,.size-list{padding:4px;gap:3px;background:#e2e9e3;border:1px solid #dce5de;border-radius:8px;box-shadow:var(--pressed)}
.mode button,.size-list button{border:0;background:transparent;color:var(--muted);font-weight:650;padding:6px 10px;min-height:33px;border-radius:6px;white-space:nowrap}
.mode button[aria-pressed=true],.size-list button[aria-pressed=true]{color:var(--purple);background:linear-gradient(145deg,#eee8f6,#e1d7ef);box-shadow:2px 2px 4px #7a708544,inset 0 1px #ffffffc7}
main.wrap{padding-bottom:27px}
.title-row{gap:18px;justify-content:space-between;margin:22px 0 16px}
h1{font-size:30px;line-height:1.2;font-weight:790}
.workspace{display:grid;grid-template-columns:minmax(227px,252px) minmax(0,1fr) minmax(238px,274px);gap:14px;align-items:start}
.left-rail{display:grid;gap:12px}
.panel{border:1px solid #f8fbf7;border-right-color:#d6e1d9;border-bottom-color:#d6e1d9;border-radius:8px;background:var(--surface);min-width:0;box-shadow:7px 8px 19px #78948532,-5px -5px 15px #fafffad9,inset 0 1px #fff}
.rail-panel{padding:13px}
.panel-title{gap:8px;font-size:15px;font-weight:750;margin-bottom:11px}
.panel-title .icon{color:var(--purple);width:17px;height:17px}
.tool-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tool-grid .action{width:100%;min-width:0}
.tool-grid [aria-pressed=true],.action[aria-pressed=true]{
  background:var(--soft);color:var(--purple);border-color:#cfbfdc #eae3f1 #eee9f4 #d6c8e5;
  box-shadow:inset 3px 3px 6px #9780b34f,inset -2px -2px 5px #ffffffa6;
}
.button:active:not(:disabled),.action:active:not(:disabled),.mode button:active,.size-list button:active,.level:active{box-shadow:var(--pressed);translate:0 1px}
.edit-tools{display:flex;align-items:center;gap:5px;margin-top:8px}
.edit-tools .clear{margin-left:auto}
.palette-groups{display:grid;gap:10px}
.color-group h3{font-size:11px;font-weight:650;color:var(--muted);margin-bottom:4px}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.swatch{
  display:grid;place-items:center;min-width:0;aspect-ratio:1;border-radius:50%;border:1px solid #31494038;
  background:radial-gradient(circle at 28% 19%,#ffffff9c,transparent 54%),var(--swatch);
  padding:0;box-shadow:2px 3px 4px #657d6c40,-1px -1px 3px #fff,inset -2px -3px 4px #31463d36;
}
.swatch::after{content:"";width:24%;height:24%;border-radius:50%;background:#f0eee6;box-shadow:inset 1px 1px 2px #34483e8c,0 1px 1px #ffffff9d}
.swatch[aria-pressed=true]{outline:2px solid var(--purple);outline-offset:1px}
.swatch:hover{translate:0 -1px}
.color-form{gap:5px;margin-top:12px}
.color-form input{width:100%;min-width:0;padding:7px 8px;border:1px solid #d7e2d9;border-radius:7px;background:#e5ece6;box-shadow:var(--pressed);font-family:ui-monospace,monospace}
.color-form .action{width:35px;min-height:35px}
.color-error{color:#9b3456;font-size:12px;margin-top:5px}
.board-panel{overflow:hidden}
.board-head{min-height:55px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:7px 10px;justify-content:space-between;align-items:center}
.board-head h2{font-size:15px;display:flex;align-items:center;gap:7px}
.board-head h2 .icon{color:var(--purple)}
.board-tools{gap:4px}
.board-tools .action{width:29px;min-height:30px}
.zoom-value{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.stage{
  position:relative;isolation:isolate;overflow:hidden;margin-inline:10px;border-radius:8px;
  background:linear-gradient(148deg,#d9e4dc 0%,#e6ede5 55%,#edf0e8 100%);
  border:1px solid #cfddd3;border-bottom-color:#f7fbf7;
  box-shadow:inset 7px 8px 19px #728e7e4f,inset -6px -7px 16px #fcfff7d9;
  height:min(65vh,636px);min-height:395px;
}
#board{width:100%;height:100%;display:block;touch-action:none;outline-offset:-3px;cursor:crosshair}
#board[data-tool=hand]{cursor:grab}
#board[data-tool=hand]:active{cursor:grabbing}
.stage-badge{position:absolute;top:10px;left:10px;pointer-events:none;background:#e4ece5;color:var(--muted);border:1px solid #f7faf6;border-radius:6px;box-shadow:2px 3px 7px #81978938;padding:3px 7px;font-size:11px;font-weight:650}
.swarm-intro{position:absolute;z-index:2;inset:0;display:grid;place-items:center;background:#e9efe7ed;pointer-events:none}
.swarm-window{width:min(285px,calc(100% - 20px));padding:12px 15px;background:var(--surface);border:1px solid #f9fcf9;border-radius:8px;box-shadow:var(--raised)}
.swarm-scene{display:block;width:100%;height:auto;background:#e4ece5;border:1px solid #d8e1d9;border-radius:8px;box-shadow:var(--pressed)}
.swarm-bead{opacity:0;transition:opacity .12s}
.swarm-bead.placed{opacity:1}
.swarm-cursor{filter:drop-shadow(1px 1.5px 1.2px #42564955)}
.swarm-footer{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:9px;font-size:12px;color:var(--muted)}
.swarm-footer strong{font-weight:700}
.swarm-footer button{pointer-events:auto;min-height:31px;font-size:12px}
.board-foot{min-height:56px;justify-content:space-between;padding:8px 11px;gap:7px;flex-wrap:wrap}
.board-status,.finish-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.board-status{color:var(--muted);gap:11px;font-size:12px}
.selected-color{gap:5px;font:11px ui-monospace,monospace}
.selected-color i{width:13px;height:13px;border:1px solid #354a4144;border-radius:50%;background:var(--picked);box-shadow:inset 1px 1px 2px #ffffff8c,1px 2px 3px #82978c52}
.coordinate{min-width:52px;font-variant-numeric:tabular-nums}
.right-rail{display:grid;gap:12px}
.progress-label{justify-content:space-between;gap:6px}
.progress-label h2{font-size:15px}
.progress-label strong{font-size:20px;color:var(--purple);font-variant-numeric:tabular-nums}
.track{margin-top:9px;height:11px;background:#dfe8e1;border-radius:9px;overflow:hidden;box-shadow:var(--pressed)}
.track i{display:block;width:0;height:100%;background:linear-gradient(#a791d0,#8165ab);border-radius:9px;box-shadow:inset 0 1px #ffffff87;transition:width .14s ease}
.progress-stats{display:flex;justify-content:space-between;gap:5px;margin-top:8px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.ghost-setting{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);margin-top:11px;padding-top:9px;font-weight:600}
.ghost-setting input{appearance:none;width:38px;height:22px;border-radius:12px;background:#dbe4dd;position:relative;margin:0;cursor:pointer;box-shadow:var(--pressed)}
.ghost-setting input:checked{background:#85ac9b;box-shadow:inset 2px 3px 5px #3f6458a1,inset -1px -2px 3px #c7e4d8a8}
.ghost-setting input::after{content:"";position:absolute;width:16px;height:16px;top:3px;left:3px;border-radius:50%;background:linear-gradient(145deg,#fff,#dfe9df);box-shadow:1px 2px 4px #314d426c;transition:translate .15s}
.ghost-setting input:checked::after{translate:16px 0}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.level{display:grid;justify-items:center;align-content:center;gap:2px;position:relative;min-width:0;min-height:83px;padding:4px 2px 5px;background:var(--key);border:1px solid #f4f8f4;border-right-color:#dae5dd;border-bottom-color:#dae5dd;border-radius:8px;box-shadow:2px 3px 5px #7f988d46,-2px -2px 5px #ffffff94;font-size:11px;font-weight:680}
.level:hover{background:#f3f7f3}
.level[aria-pressed=true]{background:#e6dfef;border-color:#d1c5df #ece7f5 #f6f0fc #d7cce5;color:var(--purple);box-shadow:inset 3px 4px 6px #957fae42,inset -2px -2px 4px #fbf6ffda}
.level canvas{display:block;width:40px;height:40px;image-rendering:pixelated;filter:drop-shadow(1px 2px 0 #4b544838)}
.level-number{position:absolute;left:5px;top:5px;font-size:9px;color:var(--muted)}
.level-rating{height:11px;color:#9b5a20;font-size:9px;line-height:11px}
.import-link{width:100%;margin-top:10px}
.toast{position:fixed;z-index:5;bottom:16px;left:50%;translate:-50% 0;background:#322643;color:#fff;border-radius:8px;padding:8px 13px;max-width:calc(100% - 24px);box-shadow:0 4px 16px #27203435}
dialog{width:min(470px,calc(100% - 24px));max-height:calc(100% - 24px);padding:17px;border:1px solid #f6faf5;border-radius:8px;color:var(--ink);background:var(--surface);box-shadow:8px 12px 46px #263f374d,inset 0 1px 1px #ffffffdc}
dialog::backdrop{background:#233d3361}
.modal-head{justify-content:space-between;gap:8px;margin-bottom:9px}
.modal-head h2{font-size:19px}
.modal-head .action{width:34px;min-height:34px}
.modal-actions{justify-content:flex-end;gap:7px;margin-top:13px;flex-wrap:wrap}
.modal-copy{color:var(--muted);font-size:13px}
.field{display:grid;gap:4px;margin-top:10px;font-size:13px;font-weight:650}
.field input:not([type=radio]),.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:#e6ede7;box-shadow:var(--pressed)}
.field input[type=file]{font-size:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{display:grid;place-items:center;min-height:108px;margin-top:10px;border:1px solid var(--line);border-radius:7px;background:#e6ede8;box-shadow:var(--pressed)}
.preview canvas,.art-thumb{width:96px;height:96px;image-rendering:pixelated}
.preview-text{color:var(--muted);font-size:12px}
.score-stars{text-align:center;font-size:30px;color:#ad642a;margin:2px 0 9px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:#e3ebe4;border-radius:8px;padding:9px 3px;gap:4px;box-shadow:var(--pressed)}
.score-grid span{display:block;color:var(--muted);font-size:12px}
.score-grid strong{font-size:17px;display:block}
.gallery{padding:0;margin:0;list-style:none}
.gallery li{display:grid;grid-template-columns:47px minmax(0,1fr) auto auto;gap:7px;align-items:center;border-top:1px solid var(--line);padding:7px 0}
.gallery .art-thumb{width:45px;height:45px;background:#f2eafa;border-radius:7px}
.gallery strong{display:block;overflow-wrap:anywhere}
.gallery small{color:var(--muted)}
.gallery .action{width:34px;min-height:34px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-width:1120px){.wrap{width:calc(100% - 34px)}.workspace{grid-template-columns:minmax(183px,208px) minmax(0,1fr) minmax(202px,224px);gap:10px}.rail-panel{padding:10px}.swatches{gap:3px}.tool-grid .action{min-height:34px}.stage{min-height:370px}}
@media(max-width:860px){.workspace{grid-template-columns:minmax(176px,200px) minmax(0,1fr)}.right-rail{grid-column:1/-1;grid-template-columns:minmax(170px,200px) minmax(0,1fr)}.levels{grid-template-columns:repeat(3,1fr)}}
@media(max-width:575px){.wrap{width:calc(100% - 20px)}.topbar .wrap{min-height:56px}.brand{gap:6px;font-size:17px}.brand small{font-size:9px}.header-actions{gap:4px}.header-actions .button{padding:4px 5px;gap:4px;font-size:12px;min-height:33px}.header-actions .action{width:32px;min-height:33px}.header-actions .icon{width:16px;height:16px}.title-row{margin:12px 0 8px;gap:3px}h1{font-size:21px}.mode button{padding:3px 6px;min-height:27px;font-size:12px}.workspace{grid-template-columns:minmax(0,1fr);gap:8px}.left-rail{display:contents}.tools-panel{order:-2;display:flex;align-items:center;gap:4px;padding:6px}.tools-panel .panel-title{margin:0 3px 0 0;font-size:0}.tools-panel .panel-title .icon{width:16px;height:16px}.tool-grid{grid-template-columns:repeat(5,1fr);gap:3px;flex:1}.tool-grid .action,.edit-tools .action{min-height:35px}.edit-tools{margin:0;gap:3px}.edit-tools .action{width:29px}.edit-tools .icon,.tool-grid .icon{width:16px;height:16px}.board-panel{order:-1}.board-head{min-height:42px;padding:5px 6px;gap:3px}.board-head h2{font-size:12px;gap:3px}.board-head h2 .icon{width:14px;height:14px}.size-list button{font-size:11px;padding:3px 4px;min-height:26px}.board-tools .action{width:25px;min-height:26px}.zoom-value{min-width:33px;font-size:10px}.stage{height:auto;aspect-ratio:1.04;min-height:0}.board-foot{padding:5px 6px;min-height:45px}.board-foot .button{padding:4px 7px;min-height:33px;font-size:12px}.board-foot .icon{width:16px;height:16px}.board-status{gap:4px;font-size:11px}.coordinate{min-width:40px}.swatches{grid-template-columns:repeat(8,27px);gap:5px}.right-rail{grid-column:auto;grid-template-columns:1fr;gap:8px}.levels{grid-template-columns:repeat(3,1fr)}}
@media(max-width:350px){.board-head h2{font-size:0}.tools-panel .panel-title{display:none}.brand small{display:none}.finish-actions{gap:4px}.board-status{gap:3px}.header-actions .button{font-size:11px}}
@media(max-width:575px){.stage{margin-inline:5px}}
@media(prefers-reduced-motion:reduce){*,*::after{transition:none!important}}
</style>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4zM15 5l4 4"/></symbol>

<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18m6-18v18"/></symbol>

<script>

  choice: stored.choice === 'free' || ideaIds.has(stored.choice) || (imported && stored.choice === 'import') ? stored.choice : 'heart',
  lastPattern: ideaIds.has(stored.lastPattern) || (imported && stored.lastPattern === 'import') ? stored.lastPattern : 'heart',
  size: sizes.includes(stored.size) ? stored.size : 29,
  color: Number.isInteger(stored.color) && palette[stored.color] ? stored.color : 8,
  sound: stored.sound !== false, ghost: stored.ghost !== false, tool:'brush', imported,
  grid:[], target:null, elapsed:0, started:0, settled:false, fused:0, ironing:false,
  zoom:1, offsetX:0, offsetY:0, cursor:null, keyboard:false, undo:[], redo:[], score:null

if (state.choice === 'import') state.size = imported.size;

function patternGrid(pattern,size) {
  if (!pattern) return null;
  if (pattern.grid) return pattern.grid;
  const grid = blank(size);
  const width = Math.max(...pattern.rows.map(row => row.length));
  const top = Math.floor((size - pattern.rows.length) / 2);
  const left = Math.floor((size - width) / 2);
  pattern.rows.forEach((row,y) => [...row].forEach((cell,x) => {
    if (cell !== '.' && grid[y+top] && x+left >= 0 && x+left < size) grid[y+top][x+left] = pattern.colors[cell] ?? -1;
  }));
  return grid;
}

  return state.elapsed + (state.started ? Date.now() - state.started : 0);
}

  drafts[keyFor()] = {grid:state.grid, elapsed:spent(), settled:state.settled, fused:state.fused === 1};
  try {
    localStorage.setItem(storageKey,JSON.stringify({
      choice:state.choice,lastPattern:state.lastPattern,size:state.size,color:state.color,
      sound:state.sound,ghost:state.ghost,custom,drafts,best,works,imported:state.imported
    }));

    return true;

    if (!storageFailed) toast('浏览器无法保存数据，本次编辑仍可继续。');
    storageFailed = true;
    return false;
  }
}
function loadDraft() {
  const draft = drafts[keyFor()];
  state.grid = blank(state.size);
  if (Array.isArray(draft?.grid)) {
    state.grid.forEach((row,y) => row.forEach((_,x) => {
      const index = draft.grid[y]?.[x];
      if (Number.isInteger(index) && palette[index]) row[x] = index;
    }));
  }
  state.target = patternGrid(currentPattern(),state.size);
  state.elapsed = draft?.elapsed || 0;
  state.started = 0;
  state.settled = Boolean(draft?.settled);
  state.fused = draft?.fused ? 1 : 0;
  state.undo = [];
  state.redo = [];
  state.cursor = null;
  state.keyboard = false;
  state.zoom = 1;
  state.offsetX = 0;
  state.offsetY = 0;
  state.score = tally();
}
// The required cells decide when a round ends. Incorrect colors and extra beads lower accuracy.
function tally() {
  let total=0, occupied=0, correct=0, beads=0, extra=0;
  state.grid.forEach((row,y) => row.forEach((color,x) => {
    const expected = state.target?.[y]?.[x] ?? -1;
    if (expected >= 0) {
      total++;
      if (color >= 0) occupied++;
      if (color === expected) correct++;
    } else if (color >= 0) extra++;
    if (color >= 0) beads++;
  }));
  return {total,occupied,correct,beads,extra};
}
const pad = value => String(value).padStart(2,'0');
function clock(ms) {
  const seconds = Math.floor(ms/1000);
  return pad(Math.floor(seconds/60)) + ':' + pad(seconds%60);
}
function rank(result) {
  return result.accuracy >= 95 ? 3 : result.accuracy >= 70 ? 2 : 1;
}
function stars(count) {
  return '★'.repeat(count) + '☆'.repeat(3-count);
}
function moreAccurate(a,b) {
  return !b || a.accuracy > b.accuracy || (a.accuracy === b.accuracy && a.duration < b.duration);
}
const board = $('#board');
const ctx = board.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const effects = new Map();
const tiles = new Map();
let viewWidth=0, viewHeight=0, frame=0;

// Draw a crisp PNG or thumbnail from color indices. Crop only the level thumbnails.
function paintImage(canvas,grid,colors,crop=false,white=false,scale=1) {
  const used=[];
  grid.forEach((row,y)=>row.forEach((index,x)=>{ if (index>=0 && colors[index]) used.push({x,y,index}); }));
  let left=0,top=0,width=grid.length,height=grid.length;
  if (crop && used.length) {
    left=Math.min(...used.map(cell=>cell.x)); top=Math.min(...used.map(cell=>cell.y));
    width=Math.max(...used.map(cell=>cell.x))-left+1;
    height=Math.max(...used.map(cell=>cell.y))-top+1;
  }
  const side=Math.max(width,height);
  const dx=Math.floor((side-width)/2),dy=Math.floor((side-height)/2);
  canvas.width=canvas.height=side*scale;
  const out=canvas.getContext('2d');
  if (white) { out.fillStyle='#FFFFFF'; out.fillRect(0,0,canvas.width,canvas.height); }
  for (const cell of used) {
    out.fillStyle=colors[cell.index];
    out.fillRect((cell.x-left+dx)*scale,(cell.y-top+dy)*scale,scale,scale);
  }

    if(!pixel) return;
    let nearest=0,distance=Infinity;
    centers.forEach((center,c)=>{
      const d=center.reduce((sum,value,axis)=>sum+(value-pixel[axis])**2,0);
      if(d<distance) {nearest=c;distance=d;}
    });
    grid[Math.floor(i/image.width)][i%image.width]=nearest;
  });
  return {colors,grid};
}
function picturePreview(image,size,colorCount) {
  const canvas=document.createElement('canvas');
  canvas.width=canvas.height=size;
  const context=canvas.getContext('2d',{willReadFrequently:true});
  const scale=Math.min(size/image.naturalWidth,size/image.naturalHeight);
  const w=Math.min(size,Math.max(1,Math.round(image.naturalWidth*scale)));
  const h=Math.min(size,Math.max(1,Math.round(image.naturalHeight*scale)));
  context.imageSmoothingQuality='high';
  context.drawImage(image,Math.floor((size-w)/2),Math.floor((size-h)/2),w,h);
  return quantize(context.getImageData(0,0,size,size),colorCount);
}
function ensureColor(hex) {
  const existing=palette.indexOf(hex);
  if(existing>=0) return existing;
  custom.push(hex);palette.push(hex);
  return palette.length-1;
}
function openImport() {
  openModal('图片转图纸','<form id="import-form"><label class="field">选择图片<input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" required></label>'+
    '<div class="form-grid"><label class="field">画板尺寸<select id="image-size">'+sizes.map(s=>'<option '+(s===state.size?'selected ':'')+'value="'+s+'">'+s+'×'+s+'</option>').join('')+'</select></label>'+
    '<label class="field">最多颜色<select id="image-colors">'+[4,6,8,12,16,24].map(n=>'<option '+(n===8?'selected ':'')+'value="'+n+'">'+n+' 色</option>').join('')+'</select></label></div>'+
    '<div class="preview"><span class="preview-text">图纸预览</span></div><p class="color-error" role="alert" id="import-error" hidden></p>'+
    '<div class="modal-actions"><button class="button" type="button" data-dismiss>取消</button><button class="button primary" id="use-image" disabled>用这张图纸</button></div></form>');
  const form=$('#import-form'), fileInput=$('#image-file'), sizeInput=$('#image-size'), colorInput=$('#image-colors');
  const preview=form.querySelector('.preview'), error=$('#import-error'), use=$('#use-image');
  let photo=null, converted=null, revision=0;
  function renderPreview() {
    if (!photo) return;
    converted=picturePreview(photo,Number(sizeInput.value),Number(colorInput.value));
    error.textContent='图片里没有可拼的像素。';
    error.hidden=Boolean(converted);
    use.disabled=!converted;
    if (converted) {
      const canvas=document.createElement('canvas');
      canvas.setAttribute('aria-label','像素图纸预览');
      paintImage(canvas,converted.grid,converted.colors);
      preview.replaceChildren(canvas);
    }
  }
  fileInput.onchange=async()=>{
    const ticket=++revision;
    const file=fileInput.files[0];
    photo=null;converted=null;use.disabled=true;error.hidden=true;preview.textContent='图纸预览';
    if(!file) return;
    if(!/^image\/(?:png|jpeg|webp|gif|bmp|avif|x-ms-bmp)$/.test(file.type)) {
      error.textContent='请选择 PNG、JPG、WebP、GIF、BMP 或 AVIF 图片。';error.hidden=false;return;
    }
    const url=URL.createObjectURL(file);
    const image=new Image();
    try {
      image.src=url;await image.decode();
      if(ticket!==revision || !form.isConnected) return;
      photo=image;renderPreview();
    } catch {
      if(ticket===revision && form.isConnected) {error.textContent='无法读取这张图片，请换一个文件。';error.hidden=false;}
    } finally {URL.revokeObjectURL(url);}
  };
  sizeInput.onchange=colorInput.onchange=renderPreview;
  form.onsubmit=event=>{
    event.preventDefault();
    if(!converted) return;
    save();
    const indices=converted.colors.map(ensureColor);
    state.imported={id:'import',name:'我的图纸',size:Number(sizeInput.value),grid:converted.grid.map(row=>row.map(i=>i<0?-1:indices[i]))};
    delete best.import;
    for(const key of Object.keys(drafts)) if(key.startsWith('import:')) delete drafts[key];
    state.choice='import';state.lastPattern='import';state.size=state.imported.size;
    loadDraft();
    const firstColor=state.target.flat().find(index=>index>=0);
    if(firstColor!==undefined) state.color=firstColor;
    state.tool='brush';effects.clear();modal.close();renderPalette();renderLevels();refresh();save();
    toast('图纸准备好了。');
  };
}
// Native scene and task scheduler inspired by swarm-cursors and Joel Califa's Swarm.
function playSwarmIntro() {
  const key='bead-studio-swarm-seen-v1';
  if (reduceMotion.matches || document.hidden) return;
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key,'1');
  } catch { /* The intro still works without session storage. */ }

  const intro=$('#swarm-intro'), skip=$('#swarm-skip');
  const beadLayer=$('#swarm-beads'), cursorLayer=$('#swarm-cursors');
  const ns='http://www.w3.org/2000/svg';
  const grid=patternGrid(patterns[0],16);
  const starts=[[22,24],[226,21],[22,120],[226,119]];
  const colors=['#7755a7','#417766','#a45170','#835833'];
  const workers=starts.map(([x,y],i)=>({start:{x,y},color:colors[i],tasks:[]}));

  grid.forEach((row,y)=>row.forEach((color,x)=>{
    if (color<0) return;
    const point={x:124+(x-7)*8,y:72+(y-7)*8};
    const bead=document.createElementNS(ns,'g');
    bead.setAttribute('class','swarm-bead');
    bead.setAttribute('transform','translate('+point.x+' '+point.y+')');
    bead.innerHTML='<circle r="3.6" cy=".65" fill="#7d4e6648"/><circle r="3.45" fill="'+builtin[color]+'"/><circle r="1.06" fill="#f9e5ec"/>';
    beadLayer.append(bead);
    const quadrant=(x<8?0:1)+(y<8?0:2);
    workers[quadrant].tasks.push({...point,bead});
  }));

  workers.forEach((worker,i)=>{
    worker.tasks.sort((a,b)=>i<2 ? a.y-b.y || a.x-b.x : b.y-a.y || b.x-a.x);
    const cursor=document.createElementNS(ns,'g');
    cursor.setAttribute('class','swarm-cursor');
    cursor.innerHTML='<path d="M0 0 4 15 7 10 13 9Z" fill="'+worker.color+'" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="13" cy="15" r="3" fill="'+worker.color+'"/>';
    cursorLayer.append(cursor);
    worker.element=cursor;
    worker.done=0;
  });

  const events=new AbortController();
  const options={capture:true,signal:events.signal};
  let frame,start;
  function finish(restoreFocus=false) {
    events.abort();
    cancelAnimationFrame(frame);
    intro.hidden=true;
    beadLayer.replaceChildren();
    cursorLayer.replaceChildren();
    if (restoreFocus) board.focus({preventScroll:true});
  }
  // The overlay doesn't intercept drawing or editing. The first interaction dismisses it.
  document.addEventListener('pointerdown',event=>{
    if (!skip.contains(event.target)) finish();
  },options);
  document.addEventListener('keydown',event=>{
    if (event.key==='Escape') finish(document.activeElement===skip);
    else if (event.target===board) finish();
  },options);
  document.addEventListener('visibilitychange',()=>{if(document.hidden) finish();},options);
  reduceMotion.addEventListener('change',event=>{if(event.matches) finish(document.activeElement===skip);},options);
  skip.addEventListener('click',()=>finish(true),options);
  intro.hidden=false;

  const placeTime=1400,endTime=1770;
  function animate(now) {
    start ??= now;
    const elapsed=now-start;
    for (const [index,worker] of workers.entries()) {
      const {tasks}=worker;
      const delay=index*43;
      const progress=Math.max(0,Math.min(1,(elapsed-delay)/(placeTime-delay)));
      const position=progress*tasks.length;
      while(worker.done<Math.floor(position)) tasks[worker.done++].bead.classList.add('placed');
      const from=tasks[worker.done-1] || worker.start;
      const to=tasks[worker.done] || worker.start;
      const fraction=progress===1 ? Math.min(1,(elapsed-placeTime)/(endTime-placeTime)) : position-worker.done;
      const ease=fraction*fraction*(3-2*fraction);
      const x=from.x+(to.x-from.x)*ease;
      const y=from.y+(to.y-from.y)*ease;
      worker.element.setAttribute('transform','translate('+x+' '+y+')');
      worker.element.style.opacity=String(progress===1?1-fraction:1);
    }
    if (elapsed<endTime) frame=requestAnimationFrame(animate);
    else finish(document.activeElement===skip);
  }
  frame=requestAnimationFrame(animate);
}
initControls();
loadDraft();
renderPalette();renderLevels();refresh();
resize();
playSwarmIntro();
new ResizeObserver(()=>{resize();constrainOffset();renderViewOptions();}).observe(board);
setInterval(updateTimer,500);
window.addEventListener('pagehide',()=>{save();});
$('#mode-free').onclick=()=>{if(state.choice!=='free') switchBoard('free',state.size);};
$('#mode-pattern').onclick=()=>{if(state.choice==='free') switchBoard(state.lastPattern,state.size);};
$('#tool-grid').onclick=event=>{
  const button=event.target.closest('[data-tool]');
  if(button) {state.tool=button.dataset.tool;displaySelection();}
};
$('#sizes').onclick=event=>{
  const button=event.target.closest('[data-size]');
  if(!button) return;
  const size=Number(button.dataset.size);
  if(size===state.size) return;
  if(state.choice==='import') {toast('上传图纸的尺寸在转换时设定。');return;}
  switchBoard(state.choice,size);
};
$('#levels').onclick=event=>{
  const button=event.target.closest('[data-level]');
  if(button && button.dataset.level!==state.choice) switchBoard(button.dataset.level,state.size);
};
$('#palette').onclick=event=>{
  const button=event.target.closest('[data-color]');
  if(button) selectColor(Number(button.dataset.color));
};
$('#color-form').onsubmit=event=>{
  event.preventDefault();
  const input=$('#hex'),error=$('#color-error');
  let hex=input.value.trim().replace(/^#/,'').toUpperCase();
  if(/^[A-F0-9]{3}$/.test(hex)) hex=[...hex].map(c=>c+c).join('');
  error.hidden=/^[A-F0-9]{6}$/.test(hex);
  if(!error.hidden) {error.textContent='请输入有效的 HEX 颜色，例如 #FF9DB7。';input.focus();return;}
  const index=ensureColor('#'+hex);
  input.value='';renderPalette();selectColor(index);
};
$('#undo').onclick=()=>history('undo');
$('#redo').onclick=()=>history('redo');
$('#clear').onclick=clearBoard;
$('#zoom-out').onclick=()=>changeZoom(state.zoom/1.25);
$('#zoom-in').onclick=()=>changeZoom(state.zoom*1.25);
$('#zoom-reset').onclick=resetZoom;
$('#sound').onclick=()=>{state.sound=!state.sound;refresh();save();if(state.sound) pop('place');};
$('#ghost').onchange=event=>{state.ghost=event.target.checked;save();invalidate();};
$('#iron').onclick=iron;
$('#export').onclick=()=>downloadOptions(state.grid,palette,currentPattern()?.name || '我的拼豆画');
$('#save-art').onclick=saveArt;
$('#gallery-open').onclick=openGallery;
$('#import-open').onclick=()=>{if(!state.ironing) openImport();};

modal.addEventListener('click',event=>{if(event.target.closest('[data-dismiss]')) modal.close();});
